<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./styles/style.css" />
    <!-- font awesome kit -->
    <script
      src="https://kit.fontawesome.com/43ad48246d.js"
      crossorigin="anonymous"
    ></script>
    <title>Tech Wave</title>
  </head>
  <body class="inter-regular background">
    <header>
      <!-- navbar -->
      <nav class="navbar container">
        <h1 class="nav-heading">Tech<span>Wave</span></h1>
        <ul class="nav-links">
          <li><a href="">About</a></li>
          <li><a href="">Episodes</a></li>
          <li><a href="">Host</a></li>
        </ul>
        <button class="primary-btn subscribed-btn">
          Subscribe <i class="fa-solid fa-arrow-right"></i>
        </button>
        <button class="hamburger"><i class="fa-solid fa-bars"></i></button>
      </nav>
      <hr />

      <!-- hero section -->
      <section class="hero">
        <!-- hero circle -->
        <div class="hero-circle-container">
          <img
            class="hero-circle"
            src="./assets/hero-circle.png"
            alt="hero circle png"
          />
          <img
            class="microphone"
            src="./assets/microphone.png"
            alt="microphone png"
          />
          <span class="hero-badge">NEW</span>
        </div>
        <!-- hero content -->
        <div class="hero-content">
          <h2>TechWave</h2>
          <p>
            Your daily dose of tech insights, productivity hacks, and personal
            growth
          </p>
          <div class="hero-btn-container">
            <button class="primary-btn spotify-btn">
              <i class="fa-brands fa-spotify"></i> Listen on Spotify
            </button>
            <button class="primary-btn subscribed-btn2">
              <i class="fa-solid fa-envelope"></i> Subscribe
            </button>
          </div>
        </div>
      </section>
    </header>

    <!-- hamburger icon -->
    <script>
      const hamburger = document.querySelector(".hamburger");
      const navLinks = document.querySelector(".nav-links");

      hamburger.addEventListener("click", () => {
        navLinks.classList.toggle("show");
      });
    </script>
  </body>
</html>
